name: Lean

on:
  pull_request:
    paths:
      - lean/**
      - .github/workflows/lean.yml
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build (checks all proofs)
        working-directory: ./lean
        run: lake build

      - name: Fail on unexpected sorry
        working-directory: ./lean
        run: |
          # Three sorries are expected, all in the Option-1 honest-root effort:
          #   - nonexistence_sound (Theorem B);
          #   - reaches (node case: split_pins assembly) and membership_sound,
          #     the honest-root Theorem A whose crux split_pins is already proved.
          # Byte-level existence binding is fully proved. Fail if others appear.
          count=$(grep -rn --include='*.lean' '^\s*sorry\b\|:= sorry\| sorry$' Ics23 | wc -l | tr -d ' ')
          echo "sorry count: $count"
          if [ "$count" -ne 3 ]; then
            echo "Unexpected number of sorry occurrences (expected 3)."
            grep -rn --include='*.lean' '^\s*sorry\b\|:= sorry\| sorry$' Ics23 || true
            exit 1
          fi
